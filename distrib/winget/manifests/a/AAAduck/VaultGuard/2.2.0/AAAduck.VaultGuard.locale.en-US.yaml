ShortDescription: Hide encrypted files inside ordinary images or Word documents
Description: VaultGuard encrypts your private files with AES-256-GCM and hides the ciphertext inside an ordinary-looking PNG image, JPG image, or Word document, so cloud drives and casual viewers see nothing suspicious. A password derived with Argon2id is required to restore the files. Fully offline: no account, no upload, no telemetry, a single portable exe.
