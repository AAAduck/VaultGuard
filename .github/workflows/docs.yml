name: Deploy Docs (GitHub Pages)

# 部署文档站（docs/ 单页）到 GitHub Pages。
# 首次运行由 configure-pages 的 enablement 自动启用 Pages（Source=GitHub Actions），
# 无需再去 Settings → Pages 手动设置；私有仓库需 GitHub Pro 及以上才可用 Pages。
# 注意：paths 含本文件自身，因此改动本 workflow 也会触发一次部署（便于自验）。
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
