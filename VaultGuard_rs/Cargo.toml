[package]
name = "vaultguard"
version = "1.3.0"
edition = "2021"
description = "VaultGuard - 网盘伪装加密保险箱"

[[bin]]
name = "vaultguard"
path = "src/main.rs"

[lib]
name = "vaultguard"
path = "src/lib.rs"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
# 缩小体积: 关闭 debug + 启 panic abort
debug = false

[profile.dev]
opt-level = 1

[dependencies]
aes = "0.8"
ctr = "0.9"
ghash = "0.5"
argon2 = "0.5"
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = "0.12"
sha2 = "0.10"
crc32fast = "1.3"
rand = "0.8"
tar = { version = "0.4", default-features = false }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
winreg = "0.52"
rfd = "0.14"
rpassword = "7"
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts", "persistence"] }
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
